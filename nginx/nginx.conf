# 요청 속도 제한 — /api/scan 한 곳에만. 키는 방문자 IP(아래 real_ip 로 복원한 값).
limit_req_zone $binary_remote_addr zone=scan:10m rate=6r/m;

server
{
    listen 80;
    server_name suseong.org www.suseong.org;
    return 301 https://$host$request_uri;
}

server
{
    listen 443 ssl;
    server_name suseong.org www.suseong.org;

    ssl_certificate /etc/nginx/certs/suseong.org.crt;
    ssl_certificate_key /etc/nginx/certs/suseong.org.key;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare 뒤: 방문자 IP 는 CF-Connecting-IP 에 있다.
    # 이 블록이 없으면 속도 제한이 Cloudflare 서버 단위로 걸린다.
    # 대역은 https://www.cloudflare.com/ips-v4 · ips-v6 (2026-09-21 기준).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # img-src 만 https: 로 열어 둔다 
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location = /api/scan
    {
        client_max_body_size 4k;
        limit_req zone=scan burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://sha:8080;
        proxy_read_timeout 35s;

        # 진행 상황을 줄 단위로 흘려보내므로 모았다 보내면 안 된다.
        proxy_buffering off;
        proxy_http_version 1.1;
    }

    location /api/
    {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /
    {
        ssi on;                      # 페이지들이 _sidebar.html 을 include 한다
        try_files $uri $uri/ =404;
    }
}
