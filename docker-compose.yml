services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - sha
    restart: unless-stopped

  api:
    build: ./api
    expose:
      - "8000"
    restart: unless-stopped

  sha:
    image: suseong41/sha:0.5.0
    expose:
      - "8080"
    read_only: true          # 디스크에 쓰지 않는다
    cap_drop:
      - ALL                  # capability 제한
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m          # 동시 스캔 4개 기준
    pids_limit: 64
    restart: unless-stopped
