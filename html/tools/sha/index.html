<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHA — suseong.org</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

  <!--# include virtual="/_sidebar.html" -->

  <main>
    <section id="sha">
      <div class="section-label">Tools</div>
      <h2>SHA</h2>
      <p class="scan-desc">
        HTML에서 악성 행위를 분석하는 탐지기입니다.<br>
        URL을 입력해 사용해 보세요.
      </p>

      <form class="scan-form" id="scan-form">
        <input type="text" id="scan-url" placeholder="여기에 URL을 입력해주세요" required
               autocomplete="off" spellcheck="false" inputmode="url" maxlength="2048">
        <button type="submit" id="scan-button">검사</button>
      </form>

      <div class="sample-row" id="sample-row" hidden></div>

      <div class="engine" id="engine" hidden>
        <div class="engine-head">
          <span class="engine-dots"><i></i><i></i><i></i></span>
          <span>ENGINE_LOGS</span>
        </div>
        <div class="engine-lines" id="engine-lines"></div>
        <div class="engine-foot">
          <span>STATUS</span>
          <span class="engine-status" id="engine-status">RUNNING</span>
        </div>
      </div>

      <div class="scan-result" id="scan-result"></div>
    </section>
  </main>

  <div class="modal-overlay" id="sample-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="sample-title"></span>
        <div class="modal-actions">
          <button class="sample-run" id="sample-run" type="button">이 샘플로 검사</button>
          <button class="modal-close" id="sample-close" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="modal-body" id="sample-body"></div>
    </div>
  </div>

  <script src="/assets/scan.js"></script>
</body>
</html>
