<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>suseong.org</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

  <!--# include virtual="/_sidebar.html" -->

  <main>

    <section id="about">
      <div class="section-label">Introduction</div>
      <h2>About</h2>
      <div class="about-placeholder">
        작성 예정입니다.
      </div>
    </section>

    <section id="skills">
      <div class="section-label">Tech Stack</div>
      <h2>Skills</h2>
      <div class="skills-grid">
        <div class="skill-badge"><span class="dot"></span>C++</div>
        <div class="skill-badge"><span class="dot"></span>Python</div>
        <div class="skill-badge"><span class="dot"></span>Linux</div>
        <div class="skill-badge"><span class="dot"></span>Docker</div>
        <div class="skill-badge"><span class="dot"></span>nginx</div>
        <div class="skill-badge"><span class="dot"></span>Cloudflare</div>
      </div>
    </section>

    <section id="projects">
      <div class="section-label">Works</div>
      <h2>Projects</h2>
      <div class="project-card">
        <div>
          <h3>개인 홈페이지</h3>
          <p>nginx · Docker · FastAPI · Cloudflare</p>
        </div>
        <span class="status-badge">개발 중</span>
      </div>
    </section>

    <section id="blog">
      <div class="section-label">Writing</div>
      <h2>Blog</h2>
      <div class="post-list" id="posts">
        <p class="loading">글을 불러오는 중...</p>
      </div>
    </section>

    <section id="github">
      <div class="section-label">Open Source</div>
      <h2>GitHub</h2>
      <div class="repo-grid" id="repos">
        <p class="loading">레포지토리를 불러오는 중...</p>
      </div>
    </section>

  </main>

  <!-- README 모달 -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-title"></span>
        <div class="modal-actions">
          <a class="modal-github-link" id="modal-link" href="#" target="_blank" rel="noopener">GitHub에서 보기 →</a>
          <button class="modal-close" id="modal-close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="/assets/vendor/marked.umd.js"></script>
  <script src="/assets/main.js"></script>
</body>
</html>
