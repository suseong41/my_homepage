<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>suseong.org</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

  <!--# include virtual="/_sidebar.html" -->

  <main>

    <section id="about">
      <div class="section-label">Introduction</div>
      <h2>About</h2>
      <div class="about-placeholder">
        작성 예정입니다.
      </div>
    </section>

    <section id="skills">
      <div class="section-label">Tech Stack</div>
      <h2>Skills</h2>
      <div class="skills-grid">
        <div class="skill-badge"><span class="dot"></span>C++</div>
        <div class="skill-badge"><span class="dot"></span>Python</div>
        <div class="skill-badge"><span class="dot"></span>Linux</div>
        <div class="skill-badge"><span class="dot"></span>Docker</div>
        <div class="skill-badge"><span class="dot"></span>nginx</div>
        <div class="skill-badge"><span class="dot"></span>Cloudflare</div>
      </div>
    </section>

    <section id="projects">
      <div class="section-label">Works</div>
      <h2>Projects</h2>
      <div class="project-card">
        <div>
          <h3>개인 홈페이지</h3>
          <p>nginx · Docker · FastAPI · Cloudflare</p>
        </div>
        <span class="status-badge">개발 중</span>
      </div>
    </section>

    <section id="blog">
      <div class="section-label">Writing</div>
      <h2>Blog</h2>
      <div class="post-list" id="posts">
        <p class="loading">글을 불러오는 중...</p>
      </div>
    </section>

    <section id="github">
      <div class="section-label">Open Source</div>
      <h2>GitHub</h2>
      <div class="repo-grid" id="repos">
        <p class="loading">레포지토리를 불러오는 중...</p>
      </div>
    </section>

  </main>

  <!-- README 모달 -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-title"></span>
        <div class="modal-actions">
          <a class="modal-github-link" id="modal-link" href="#" target="_blank" rel="noopener">GitHub에서 보기 →</a>
          <button class="modal-close" id="modal-close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    // 스크롤에 따른 사이드바 active
    const sections = document.querySelectorAll('section[id]');
    const navLinks = document.querySelectorAll('nav a');

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          navLinks.forEach(a => a.classList.remove('active'));
          const active = document.querySelector(`nav a[href="#${entry.target.id}"]`);
          if (active) active.classList.add('active');
        }
      });
    }, { threshold: 0.4 });

    sections.forEach(s => observer.observe(s));

    // GitHub 언어별 색상
    const LANG_COLORS = {
      'C++': '#f34b7d', 'C': '#555555', 'Python': '#3572A5',
      'JavaScript': '#f1e05a', 'TypeScript': '#3178c6',
      'Go': '#00ADD8', 'Rust': '#dea584', 'Java': '#b07219',
      'Shell': '#89e051', 'HTML': '#e34c26', 'CSS': '#563d7c',
    };

    function renderExpandBar(onExpand, onCollapse) {
      const bar = document.createElement('div');
      bar.className = 'expand-bar';
      let expanded = false;

      bar.textContent = '+ 더 보기';
      bar.addEventListener('click', () => {
        if (!expanded) {
          onExpand();
          bar.textContent = '- 접기';
        } else {
          onCollapse();
          bar.textContent = '+ 더 보기';
        }
        expanded = !expanded;
      });
      return bar;
    }

    function repoCardHtml(repo) {
      const langColor = LANG_COLORS[repo.language] || '#94a3b8';
      const langHtml = repo.language
        ? `<span class="repo-lang"><span class="lang-dot" style="background:${langColor}"></span>${repo.language}</span>`
        : '';
      const starsHtml = repo.stars > 0
        ? `<span class="repo-stars">★ ${repo.stars}</span>`
        : '';
      return `
        <div class="repo-card" onclick="openReadme('${repo.name}', '${repo.url}')">
          <div class="repo-name">${repo.name}</div>
          <div class="repo-desc">${repo.description || '설명 없음'}</div>
          <div class="repo-meta">
            ${langHtml}${starsHtml}
            <span class="repo-updated">${repo.updated_at}</span>
          </div>
        </div>
      `;
    }

    // 레포 목록 불러오기
    fetch('/api/repos')
      .then(r => r.json())
      .then(data => {
        const container = document.getElementById('repos');
        const repos = data.repos;
        if (!repos.length) {
          container.innerHTML = '<p class="loading">레포지토리가 없습니다.</p>';
          return;
        }
        const limit = 4;
        container.innerHTML = repos.slice(0, limit).map(repoCardHtml).join('');
        if (repos.length > limit) {
          const bar = renderExpandBar(
            () => {
              const html = repos.slice(limit).map(r => repoCardHtml(r).replace('<div class="repo-card"', '<div class="repo-card repo-extra"')).join('');
              bar.insertAdjacentHTML('beforebegin', html);
            },
            () => container.querySelectorAll('.repo-extra').forEach(el => el.remove())
          );
          container.appendChild(bar);
        }
      })
      .catch(() => {
        document.getElementById('repos').innerHTML = '<p class="loading">불러오지 못했습니다.</p>';
      });

    // README 모달
    const modal    = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalLink  = document.getElementById('modal-link');
    const modalBody  = document.getElementById('modal-body');

    function openReadme(name, url) {
      modalTitle.textContent = name;
      modalLink.href = url;
      modalBody.innerHTML = '<p class="loading">README를 불러오는 중...</p>';
      modal.classList.add('open');
      document.body.style.overflow = 'hidden';

      fetch(`/api/repos/${name}/readme`)
        .then(r => r.json())
        .then(data => { modalBody.innerHTML = marked.parse(data.content); })
        .catch(() => { modalBody.innerHTML = '<p class="loading">README를 불러오지 못했습니다.</p>'; });
    }

    document.getElementById('modal-close').addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    function closeModal() {
      modal.classList.remove('open');
      document.body.style.overflow = '';
    }

    // 카테고리별 색상 팔레트
    const CATEGORY_COLORS = [
      { bg: '#eff6ff', color: '#1d4ed8' },
      { bg: '#f0fdf4', color: '#15803d' },
      { bg: '#fdf4ff', color: '#7e22ce' },
      { bg: '#fff7ed', color: '#c2410c' },
      { bg: '#fdf2f8', color: '#be185d' },
      { bg: '#f0fdfa', color: '#0f766e' },
    ];

    const categoryColorMap = {};
    let colorIndex = 0;

    function getCategoryStyle(category) {
      if (!category) return { bg: '#f1f5f9', color: '#475569' };
      if (!categoryColorMap[category]) {
        categoryColorMap[category] = CATEGORY_COLORS[colorIndex % CATEGORY_COLORS.length];
        colorIndex++;
      }
      return categoryColorMap[category];
    }

    function postCardHtml(post) {
      const { bg, color } = getCategoryStyle(post.category);
      return `
        <a class="post-card" href="${post.link}" target="_blank" rel="noopener">
          <span class="post-category" style="background:${bg};color:${color}">${post.category || '기타'}</span>
          <span class="post-title">${post.title}</span>
          <span class="post-date">${post.pubDate}</span>
        </a>
      `;
    }

    // 블로그 글 불러오기
    fetch('/api/posts')
      .then(r => r.json())
      .then(data => {
        const container = document.getElementById('posts');
        const posts = data.posts;
        if (!posts.length) {
          container.innerHTML = '<p class="loading">글이 없습니다.</p>';
          return;
        }
        const limit = 5;
        container.innerHTML = posts.slice(0, limit).map(postCardHtml).join('');
        if (posts.length > limit) {
          const bar = renderExpandBar(
            () => {
              const html = posts.slice(limit).map(p => postCardHtml(p).replace('<a class="post-card"', '<a class="post-card post-extra"')).join('');
              bar.insertAdjacentHTML('beforebegin', html);
            },
            () => container.querySelectorAll('.post-extra').forEach(el => el.remove())
          );
          container.appendChild(bar);
        }
      })
      .catch(() => {
        document.getElementById('posts').innerHTML = '<p class="loading">글을 불러오지 못했습니다.</p>';
      });

  </script>
</body>
</html>
